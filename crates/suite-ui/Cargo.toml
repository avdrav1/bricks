[package]
name = "suite-ui"
description = "User-interface conventions shared by Brick, Slate, and Frame"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
gtk.workspace = true
suite-core.workspace = true
tracing.workspace = true

# Windows' dark title bars (DWM).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Graphics_Dwm"] }

[lints]
workspace = true

[lib]
# `cargo bench` runs only apps/brick/benches/corpus.rs (BENCH-1).
bench = false
