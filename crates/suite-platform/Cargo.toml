[package]
name = "suite-platform"
description = "Operating-system integration shared by Brick, Slate, and Frame"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
suite-core.workspace = true

# The console a GUI program prints to, and the app mode in the registry (WIN-3).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console", "Win32_System_Registry"] }

[lints]
workspace = true

[lib]
# `cargo bench` runs only apps/brick/benches/corpus.rs (BENCH-1).
bench = false
