name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: python3 -m unittest discover -s scripts
      - run: python3 scripts/backlog.py status
  windows:
    # x86_64 with MSYS2 UCRT64: MSYS2's own Rust (x86_64-pc-windows-gnu) and GTK 4 (ADR 0011,
    # WIN-1). No `core.autocrlf` setting: .gitattributes keeps the fixtures' bytes.
    runs-on: windows-latest
    timeout-minutes: 90
    defaults: { run: { shell: "msys2 {0}" } }
    env:
      CARGO_HOME: D:\cargo-home
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      # setup-msys2 caches the downloaded packages between runs.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-rust
      - name: Toolchain
        run: |
          rustc -vV
          cargo clippy --version
          echo "gtk4 $(pkg-config --modversion gtk4)"
      # The crates' sources and the build, keyed by the toolchain and the lock file: a run
      # restores the newest one and saves its own.
      - id: toolchain
        run: echo "rustc=$(rustc -V | tr -cd '[:alnum:].-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            D:\cargo-home\registry
            target
          key: windows-${{ steps.toolchain.outputs.rustc }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            windows-${{ steps.toolchain.outputs.rustc }}-${{ hashFiles('Cargo.lock') }}-
            windows-${{ steps.toolchain.outputs.rustc }}-
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
  macos:
    # arm64, the oldest macOS the suite supports (ADR 0011). GUI checks stay on Linux.
    runs-on: macos-14
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: brew install gtk4 pkgconf
      # The metric-compatible fonts the apps carry on macOS (MAC-6); suite-ui's tests use them.
      - name: Fetch the bundled fonts
        run: python3 scripts/fetch_fonts.py target/fonts
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      # Saving syncs with fcntl(F_FULLFSYNC) (MAC-2): trace suite-file's atomic-save tests
      # with fs_usage and find the calls.
      - name: Saves use F_FULLFSYNC
        run: |
          cargo test -p suite-file --test atomic --no-run
          sudo fs_usage -w -f filesys > "$RUNNER_TEMP/fs_usage.log" 2>&1 &
          sleep 3
          cargo test -p suite-file --test atomic
          sleep 2
          sudo pkill -INT fs_usage || true
          sleep 1
          grep FULLFSYNC "$RUNNER_TEMP/fs_usage.log" | grep atomic | head -20
          grep FULLFSYNC "$RUNNER_TEMP/fs_usage.log" | grep -q atomic
      # Command keys (MAC-3): System Events drives each release build with ⌘O, ⌘S, and ⌘Z
      # and the files show the saves; the screenshots are the artifact.
      - id: release
        run: cargo build --release -p brick -p slate -p frame -p etch
      - name: Command keys drive each app
        run: scripts/check_mac_keys.sh target/release
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: macos-keys, path: out/mac-keys, if-no-files-found: warn }
      # The menu bar and title bars (MAC-4): System Events reads each app's menus, their
      # keys, and its window's title bar buttons, opens About, and quits with ⌘Q; the
      # screenshots show the menus open.
      - name: Menus are in the menu bar and windows have macOS's title bar
        if: always()
        run: scripts/check_mac_ui.sh target/release
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: macos-ui, path: out/mac-ui, if-no-files-found: warn }
      # Files from Launch Services (MAC-5): `open -a` with a file, a second file while the
      # app runs, and no file, through a minimal bundle per app (scripts/mac_app.py), drawn
      # with the renderer the apps choose on macOS (cairo); the screenshots are the artifact.
      - name: Launch Services opens files in each app
        if: always() && steps.release.outcome == 'success'
        run: scripts/check_mac_open.sh target/release
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: macos-open, path: "out/mac-open/shots\nout/mac-open/logs\nout/mac-open/summary.txt", if-no-files-found: warn }
  bench:
    # Prints the apps/brick/docs/BENCHMARKS.md table. Runner numbers are informational: gates use the
    # reference box, and rows that open a window are skipped (no display).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev
      - run: python3 scripts/gen_corpus.py --max-mb 1024
      - run: cargo bench
  macos-look:
    # Fonts and dark mode on macOS (MAC-6): screenshots in light and dark appearance, and the
    # Brick, Slate, Frame, and Etch windows following the Mac's appearance.
    runs-on: macos-14
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: brew install gtk4 pkgconf adwaita-icon-theme
      - run: python3 scripts/fetch_fonts.py target/fonts
      - run: cargo build -p brick -p slate -p frame -p etch
      - run: scripts/check_mac_look.sh out
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: macos-look, path: "out/shots\nout/logs", if-no-files-found: warn }
