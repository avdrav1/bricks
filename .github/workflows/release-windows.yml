# The Windows release (WIN-5, WIN-6): each app's self-contained folder and its per-user Inno
# Setup installer, <app>-<version>-x86_64-windows-setup.exe, built on windows-latest with
# MSYS2's UCRT64 GTK (`scripts/ship.sh APP build --windows`, which runs
# scripts/win_bundle.sh), then installed, started, used, and uninstalled on a fresh runner
# with MSYS2 moved away and nothing of it on PATH, through Setup.exe and through install.ps1
# (scripts/check_win_install.ps1). `scripts/ship.sh APP build --windows` elsewhere
# dispatches it and `scripts/ship.sh APP fetch-windows RUN_ID` takes a green run's artifact
# `windows-APP` into dist/ for the upload. A release tag builds its app; a push that changes
# the bundling builds and checks all four.
name: release-windows
on:
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps to build (brick slate frame etch)"
        default: "brick slate frame etch"
  push:
    # GitHub skips path filters for tags, so a release tag always runs.
    tags: ["v*", "slate-v*", "frame-v*", "etch-v*"]
    branches: ["**"]
    paths:
      - .github/workflows/release-windows.yml
      - scripts/win_bundle.sh
      - scripts/win_libs.sh
      - scripts/win_licenses.py
      - scripts/win_app.py
      - scripts/mac_app.py
      - scripts/mac_licenses.py
      - scripts/rust_licenses.py
      - scripts/check_win_install.ps1
      - packaging/windows/**
      - crates/suite-platform/src/bundle.rs
      - "sites/*/install.ps1"
      # The suite's installer runs the apps' installers; install-suite.yml checks it.
      - "!sites/cronkite/install.ps1"
jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults: { run: { shell: "msys2 {0}" } }
    env:
      CARGO_HOME: D:\cargo-home
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            make
            patch
            zstd
      - id: apps
        name: Which apps
        shell: bash
        env: { INPUT_APPS: "${{ inputs.apps }}" }
        run: |
          case "$GITHUB_REF" in
            refs/tags/slate-v*) apps=slate ;;
            refs/tags/frame-v*) apps=frame ;;
            refs/tags/etch-v*) apps=etch ;;
            refs/tags/v*) apps=brick ;;
            *) apps=${INPUT_APPS:-brick slate frame etch} ;;
          esac
          for a in $apps; do
            case $a in brick|slate|frame|etch) ;; *) echo "unknown app $a"; exit 1 ;; esac
          done
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
      - id: toolchain
        run: echo "rustc=$(rustc -V | tr -cd '[:alnum:].-')" >> "$GITHUB_OUTPUT"
      # The crates' sources and the release build, keyed by the toolchain and the lock file.
      - uses: actions/cache@v4
        with:
          path: |
            D:\cargo-home\registry
            target/release
          key: windows-release-${{ steps.toolchain.outputs.rustc }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            windows-release-${{ steps.toolchain.outputs.rustc }}-${{ hashFiles('Cargo.lock') }}-
            windows-release-${{ steps.toolchain.outputs.rustc }}-
      # cairo without lzo and libtiff without jbig (scripts/win_libs.sh), kept between runs;
      # the script rebuilds a library whose record differs from its own.
      - uses: actions/cache@v4
        with: { path: target/win-libs, key: "win-libs-${{ hashFiles('scripts/win_libs.sh') }}" }
      - name: cairo without lzo, libtiff without jbig
        run: scripts/win_libs.sh target/win-libs
      # The metric-compatible fonts Brick, Slate, and Frame carry (WIN-4).
      - name: Fetch the bundled fonts
        shell: pwsh
        run: python scripts/fetch_fonts.py target/fonts
      # Each app builds alone (`cargo build -p APP`), as its release always has: building
      # them together unifies features.
      - name: Build and bundle
        run: |
          for a in ${{ steps.apps.outputs.apps }}; do
            scripts/ship.sh "$a" build --windows | tee -a sizes.txt
          done
          { echo '```'; cat sizes.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: The bundles' DLLs and licences
        run: |
          for d in dist/*-x86_64-windows/*/; do
            echo "== $d: $(ls "$d/bin" | grep -ci '\.dll$') DLLs"
            ls "$d/bin" | tr '\n' ' '; echo
            grep -E '^[a-z0-9].* [0-9].*: ' "$d/licenses/THIRD-PARTY.txt" || true
          done
      - name: Upload brick
        if: contains(steps.apps.outputs.apps, 'brick')
        uses: actions/upload-artifact@v4
        with: { name: windows-brick, path: "dist/brick-*-x86_64-windows-setup.exe*", if-no-files-found: error, compression-level: 0 }
      - name: Upload slate
        if: contains(steps.apps.outputs.apps, 'slate')
        uses: actions/upload-artifact@v4
        with: { name: windows-slate, path: "dist/slate-*-x86_64-windows-setup.exe*", if-no-files-found: error, compression-level: 0 }
      - name: Upload frame
        if: contains(steps.apps.outputs.apps, 'frame')
        uses: actions/upload-artifact@v4
        with: { name: windows-frame, path: "dist/frame-*-x86_64-windows-setup.exe*", if-no-files-found: error, compression-level: 0 }
      - name: Upload etch
        if: contains(steps.apps.outputs.apps, 'etch')
        uses: actions/upload-artifact@v4
        with: { name: windows-etch, path: "dist/etch-*-x86_64-windows-setup.exe*", if-no-files-found: error, compression-level: 0 }
  verify:
    # A fresh runner with MSYS2 moved away and a PATH of Windows' own folders: the installer
    # must be enough.
    needs: bundle
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "windows-*", path: dist, merge-multiple: true }
      - name: Move MSYS2 away
        shell: pwsh
        run: if (Test-Path C:\msys64) { Rename-Item C:\msys64 C:\msys64-away }
      - name: Install, start, use, and uninstall each app through Setup.exe and install.ps1
        shell: powershell
        run: '& .\scripts\check_win_install.ps1 -Dist dist -Apps "${{ needs.bundle.outputs.apps }}"'
      - name: MSYS2 back
        if: always()
        shell: pwsh
        run: if (Test-Path C:\msys64-away) { Rename-Item C:\msys64-away C:\msys64 }
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: windows-install, path: "out/win-install/shots\nout/win-install/logs\nout/win-install/summary.txt", if-no-files-found: warn }
