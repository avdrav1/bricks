[package]
name = "spreadsheet"
description = "A fast, lightweight spreadsheet for Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "spreadsheet"
path = "src/main.rs"
bench = false

[dependencies]
csv-engine.workspace = true
data-model.workspace = true
grid.workspace = true
commands.workspace = true
file-format.workspace = true
jobs.workspace = true
# UI toolkit per docs/decisions/0001-ui-toolkit.md; v4_14 matches Ubuntu 24.04's GTK.
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }

[lints]
workspace = true

[dev-dependencies]
libc = "0.2.190"

[[bench]]
name = "corpus"
harness = false
