[package]
name = "xlsx"
description = "XLSX import into indexed sheet copies with styles; save by patching the original package"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
calamine = "0.36"
csv-engine.workspace = true
data-model.workspace = true
suite-file.workspace = true
formula.workspace = true
quick-xml = "0.41"
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
# The corpus example writes Excel-like workbooks with a writer independent of Bricks'.
rust_xlsxwriter = { version = "0.99", features = ["constant_memory"] }

[lints]
workspace = true

[lib]
# `cargo bench` runs only apps/bricks/benches/corpus.rs (BENCH-1).
bench = false
