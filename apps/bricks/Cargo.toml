[package]
name = "bricks"
description = "A fast, lightweight spreadsheet for Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "bricks"
path = "src/main.rs"
bench = false

[dependencies]
suite-core.workspace = true
suite-ui.workspace = true
suite-file.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
csv-engine.workspace = true
data-model.workspace = true
grid.workspace = true
commands.workspace = true
file-format.workspace = true
formula.workspace = true
jobs.workspace = true
xlsx.workspace = true
# UI toolkit per apps/bricks/docs/decisions/0001-ui-toolkit.md; v4_14 matches Ubuntu 24.04's GTK.
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }

[lints]
workspace = true

[dev-dependencies]
libc = "0.2.190"

[[bench]]
name = "corpus"
harness = false
